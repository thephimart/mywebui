[project]
name = "mywebui"
version = "0.1.0a3"
description = "Local-first AI workbench and web UI for automation workloads (pure Python)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
  { name = "Phimart Consulting" }
]

keywords = [
  "local-first",
  "webui",
  "ai",
  "automation",
  "developer-tools",
  "pure-python"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.3.0",
    "bcrypt>=4.1.0",
    "alembic>=1.13.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "ddgs>=2.1.0",
    "beautifulsoup4>=4.12.0",
    "crawl4ai>=0.4.0",
    "playwright>=1.40.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "types-PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/thephimart/mywebui"
Repository = "https://github.com/thephimart/mywebui"
Issues = "https://github.com/thephimart/mywebui/issues"

[project.scripts]
mywebui = "mywebui.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
